appId: com.relay.multiagent
productName: Relay
asar: true
directories:
  output: release
files:
  - dist-desktop/main.cjs
  - dist-desktop/main.cjs.map
  - dist-desktop/preload.cjs
  - dist-desktop/preload.cjs.map
  - package.json
  - "!node_modules{,/**/*}"
extraResources:
  - from: .next/standalone
    to: next
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
      - "!.env*"
  - from: .next/standalone/node_modules
    to: next/node_modules
    filter:
      - "**/*"
      - "!@img{,/**/*}"
      - "!sharp{,/**/*}"
      - "!.pnpm/@img+sharp-*{,/**/*}"
      - "!.pnpm/sharp@*{,/**/*}"
      - "!**/node_modules/@img{,/**/*}"
      - "!**/node_modules/sharp{,/**/*}"
  - from: .next/static
    to: next/.next/static
  - from: public
    to: next/public
  - from: dist-desktop/worker.cjs
    to: relay/worker.cjs
  - from: dist-desktop/worker.cjs.map
    to: relay/worker.cjs.map
  - from: db/migrations
    to: relay/migrations
    filter:
      - "*.sql"
  - from: node_modules/@electric-sql/pglite/dist
    to: relay/pglite
    filter:
      - pglite.wasm
      - initdb.wasm
      - pglite.data
      - pgcrypto.tar.gz
mac:
  icon: build/Relay.icns
  category: public.app-category.productivity
  minimumSystemVersion: "12.0"
  target:
    - target: dir
      arch:
        - universal
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  title: Relay
  sign: false
